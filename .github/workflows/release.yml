name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev
      - name: Build release binary
        run: cargo build --locked --release
      - name: Package binary
        run: |
          version="${GITHUB_REF_NAME}"
          archive="close_app-${version}-linux-x86_64.tar.gz"
          mkdir -p dist
          cp target/release/close_app README.md LICENSE dist/
          tar -czf "${archive}" -C dist .
          sha256sum "${archive}" > "${archive}.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME}"
          gh release create "${version}" \
            --title "${version}" \
            --generate-notes \
            "close_app-${version}-linux-x86_64.tar.gz" \
            "close_app-${version}-linux-x86_64.tar.gz.sha256"
